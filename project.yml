name: CampusHub
options:
  bundleIdPrefix: pt.istec.mestrado
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CampusHub:
    type: application
    platform: iOS
    sources:
      - CampusHub
    info:
      path: CampusHub/Info.plist
      properties:
        CFBundleDisplayName: CampusHub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.istec.mestrado.campushub
        GENERATE_INFOPLIST_FILE: false
  CampusHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CampusHubTests
    dependencies:
      - target: CampusHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.istec.mestrado.campushub.tests
