name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compilar e testar (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar e correr os testes
        run: |
          set -o pipefail
          xcodebuild test \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Expor erros como anotações e no resumo
        if: failure()
        run: |
          echo "## Erros de compilação/testes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error:|warning: .*deprecated|Testing failed|Test Suite .* failed|✘|failed \()" xcodebuild.log | sort -u | head -60 >> "$GITHUB_STEP_SUMMARY" || echo "(nenhuma linha de erro capturada — ver últimas 80 linhas abaixo)" >> "$GITHUB_STEP_SUMMARY"
          tail -80 xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" xcodebuild.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Build de simulador (artefacto para demo, ex. Appetize.io)
        run: |
          xcodebuild build \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Publicar artefacto CampusHub.app
        uses: actions/upload-artifact@v4
        with:
          name: CampusHub-simulator
          path: build/Build/Products/Debug-iphonesimulator/CampusHub.app
