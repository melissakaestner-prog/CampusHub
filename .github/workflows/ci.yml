name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compilar e testar (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Escolher simulador iPhone disponível
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -nE 's/^ *(iPhone [^(]*[^ (]) *\(.*/\1/p' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "::error::Nenhum simulador iPhone disponível no runner."
            xcrun simctl list devices
            exit 1
          fi
          echo "Simulador escolhido: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Compilar e correr os testes
        run: |
          set -o pipefail
          xcodebuild test \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Expor falhas como anotações
        if: failure()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json 2>/dev/null || true
            if [ -s summary.json ]; then
              jq -r '"::notice::Testes — total: \(.totalTestCount // "?"), passaram: \(.passedTests // "?"), falharam: \(.failedTests // "?")"' summary.json || true
              jq -r '.testFailures[]? | "::error::\(.testName // .testIdentifier // "?"): \((.failureText // "") | gsub("\n"; " ") | .[0:400])"' summary.json | head -10 || true
            fi
          fi
          grep -E "error:|Fatal error|Testing failed" xcodebuild.log | grep -v "CoreData" | sort -u | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -B2 -A6 -E "Fatal error|Precondition failed|signal trap|Restarting after unexpected exit" xcodebuild.log | grep -v "CoreData" | head -10 | while IFS= read -r line; do
            echo "::notice::$line"
          done
          for f in $(ls -t "$HOME"/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "::notice::crash report: $(basename "$f")"
            tr ',' '\n' < "$f" | grep -E 'termination|exceptionType|procName|abort|fatal' | head -8 | while IFS= read -r line; do
              echo "::notice::${line:0:300}"
            done
          done

      - name: Guardar log e resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-e-resultados
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore

      - name: Build de simulador (artefacto para demo, ex. Appetize.io)
        run: |
          xcodebuild build \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Publicar artefacto CampusHub.app
        uses: actions/upload-artifact@v4
        with:
          name: CampusHub-simulator
          path: build/Build/Products/Debug-iphonesimulator/CampusHub.app
