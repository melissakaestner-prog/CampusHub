name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compilar e testar (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar e correr os testes
        run: |
          set -o pipefail
          xcodebuild test \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build de simulador (artefacto para demo, ex. Appetize.io)
        run: |
          xcodebuild build \
            -project CampusHub.xcodeproj \
            -scheme CampusHub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Publicar artefacto CampusHub.app
        uses: actions/upload-artifact@v4
        with:
          name: CampusHub-simulator
          path: build/Build/Products/Debug-iphonesimulator/CampusHub.app
